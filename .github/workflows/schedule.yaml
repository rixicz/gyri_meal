name: Scheduled Python Execution

on:
  schedule:
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Načtení kódu z repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Spuštění Python skriptu
        env:
          NTFY_KEY: ${{ secrets.NTFY_KEY }}
        run: python main.py
